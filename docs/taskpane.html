<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paste Minimal Changes</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="paste-diff.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: #323130;
      padding: 20px 16px;
      background: #fff;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #0078d4;
      margin-bottom: 14px;
    }
    ol {
      padding-left: 18px;
      color: #605e5c;
      line-height: 1.9;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      padding: 8px 0;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #106ebe; }
    button:disabled { background: #c8c6c4; cursor: not-allowed; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.4;
    }
    .error { color: #a4262c; }
    .ok    { color: #107c10; }
    .info  { color: #605e5c; }
  </style>
</head>
<body>
  <h1>Paste Minimal Changes</h1>
  <ol>
    <li>Select the text to replace in Word.</li>
    <li>Copy the new version to your clipboard.</li>
    <li>Click <strong>Apply</strong> — only changed words are tracked.</li>
  </ol>
  <button id="btn">Apply Minimal Paste</button>
  <div id="status" class="info"></div>

  <script>
    Office.onReady(function () {
      document.getElementById('btn').addEventListener('click', apply);
    });

    async function apply() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      setStatus('info', 'Working…');

      try {
        let clipText;
        try {
          clipText = await navigator.clipboard.readText();
        } catch {
          throw new Error('Clipboard read failed — click inside the task pane first, then try again.');
        }
        if (!clipText.trim()) throw new Error('Clipboard is empty.');

        await Word.run(async ctx => {
          const range = ctx.document.getSelection();
          range.load('text');
          const ooxmlResult = range.getOoxml();
          await ctx.sync();

          const selText = range.text;
          if (!selText) throw new Error('No text selected in Word.');

          const author = (Office.context.userProfile && Office.context.userProfile.displayName) || 'Unknown';
          const date   = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
          const rPr    = extractRPr(ooxmlResult.value);
          const docTag = extractDocumentOpenTag(ooxmlResult.value);
          const edits  = myersDiff(tokenize(selText), tokenize(clipText));
          const ooxml  = buildOoxml(edits, rPr, docTag, author, date);

          range.insertOoxml(ooxml, Word.InsertLocation.replace);
          await ctx.sync();
        });

        setStatus('ok', 'Done.');
      } catch (e) {
        setStatus('error', e.message || String(e));
      } finally {
        btn.disabled = false;
      }
    }

    function setStatus(cls, msg) {
      const el = document.getElementById('status');
      el.className = cls;
      el.textContent = msg;
    }
  </script>
</body>
</html>
