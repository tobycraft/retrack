<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paste Minimal Changes</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      color: #323130;
      padding: 20px 16px;
      background: #fff;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #0078d4;
      margin-bottom: 14px;
    }
    ol {
      padding-left: 18px;
      color: #605e5c;
      line-height: 1.9;
      margin-bottom: 18px;
    }
    button {
      width: 100%;
      padding: 8px 0;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #106ebe; }
    button:disabled { background: #c8c6c4; cursor: not-allowed; }
    textarea {
      width: 100%;
      min-height: 70px;
      padding: 6px 8px;
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 13px;
      border: 1px solid #8a8886;
      border-radius: 2px;
      resize: vertical;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
      line-height: 1.4;
    }
    .error { color: #a4262c; }
    .ok    { color: #107c10; }
    .info  { color: #605e5c; }
  </style>
</head>
<body>
  <h1>Paste Minimal Changes</h1>
  <ol>
    <li>Select the text to replace in Word.</li>
    <li>Copy the new version, then paste it into the box below.</li>
    <li>Click <strong>Apply</strong> — only changed words are tracked.</li>
  </ol>
  <textarea id="pasteTarget" placeholder="Paste new text here (Ctrl/Cmd+V)"></textarea>
  <button id="btn">Apply Minimal Paste</button>
  <div id="status" class="info"></div>

  <script>
    Office.onReady(function () {
      document.getElementById('btn').addEventListener('click', apply);
    });

    async function apply() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      setStatus('info', 'Working…');

      try {
        const pasteTarget = document.getElementById('pasteTarget');
        const clipText = pasteTarget.value;
        if (!clipText.trim()) throw new Error('Paste the new text into the box above first.');

        await Word.run(async ctx => {
          setStatus('info', 'Working… (reading selection)');
          const range = ctx.document.getSelection();
          range.load('text');
          await ctx.sync();

          const selText = range.text;
          if (!selText) throw new Error('No text selected in Word.');

          const edits = myersDiff(tokenize(selText), tokenize(clipText));
          setStatus('info', `Working… (0/${edits.length} edit tokens)`);

          // range.getOoxml()/insertOoxml() hang indefinitely on Word for the web
          // (unimplemented there despite being nominally WordApi 1.1 — see
          // OfficeDev/office-js-docs#121). Apply the diff as native insertText()/
          // delete() calls instead: with Track Changes on, Word records these as
          // <w:ins>/<w:del> itself, and inserted text inherits the surrounding
          // run's formatting automatically, so no manual rPr handling is needed.
          // Each edit group is located by searching a shrinking [cursor, end)
          // scope, so the leftmost match is always the correct next occurrence
          // even when the same token text repeats later in the selection.
          const endAnchor = range.getRange(Word.RangeLocation.end);
          let cursor = range.getRange(Word.RangeLocation.start);

          let i = 0;
          while (i < edits.length) {
            const type = edits[i].type;
            let text = '';
            while (i < edits.length && edits[i].type === type) { text += edits[i].val; i++; }

            setStatus('info', `Working… (${type} "${text.slice(0, 20)}", ${i}/${edits.length})`);

            if (type === 'insert') {
              const inserted = cursor.insertText(text, Word.InsertLocation.replace);
              await ctx.sync();
              cursor = inserted.getRange(Word.RangeLocation.end);
            } else {
              const scope = cursor.expandTo(endAnchor);
              const results = scope.search(text, { matchCase: true, matchWholeWord: false });
              results.load('items');
              await ctx.sync();
              if (results.items.length === 0) throw new Error(`Could not locate "${text}" while applying changes.`);
              const match = results.items[0];

              if (type === 'equal') {
                cursor = match.getRange(Word.RangeLocation.end);
                await ctx.sync();
              } else {
                const afterDelete = match.getRange(Word.RangeLocation.start);
                match.delete();
                await ctx.sync();
                cursor = afterDelete;
              }
            }
          }
          setStatus('info', 'Working… (finalizing)');
        });

        pasteTarget.value = '';
        setStatus('ok', 'Done.');
      } catch (e) {
        setStatus('error', e.message || String(e));
      } finally {
        btn.disabled = false;
      }
    }

    function setStatus(cls, msg) {
      const el = document.getElementById('status');
      el.className = cls;
      el.textContent = msg;
    }

    // ── Tokenizer ─────────────────────────────────────────────────────────────
    // Word sequences | punctuation sequences | whitespace sequences
    function tokenize(text) {
      return text.match(/\w+|[^\w\s]+|\s+/g) || [];
    }

    // ── Myers diff ────────────────────────────────────────────────────────────
    // Returns [{type: 'equal'|'delete'|'insert', val: token}, ...]
    function myersDiff(a, b) {
      const n = a.length, m = b.length;
      if (n === 0 && m === 0) return [];
      if (n === 0) return b.map(val => ({ type: 'insert', val }));
      if (m === 0) return a.map(val => ({ type: 'delete', val }));

      const max = n + m, off = max;
      const v = new Array(2 * max + 1).fill(0);
      const trace = [];

      outer:
      for (let d = 0; d <= max; d++) {
        trace.push(v.slice());
        for (let k = -d; k <= d; k += 2) {
          let x = (k === -d || (k !== d && v[k - 1 + off] < v[k + 1 + off]))
            ? v[k + 1 + off]
            : v[k - 1 + off] + 1;
          let y = x - k;
          while (x < n && y < m && a[x] === b[y]) { x++; y++; }
          v[k + off] = x;
          if (x >= n && y >= m) break outer;
        }
      }

      const edits = [];
      let x = n, y = m;

      for (let d = trace.length - 1; d > 0; d--) {
        const prev = trace[d];
        const k = x - y;
        const prevK = (k === -d || (k !== d && prev[k - 1 + off] < prev[k + 1 + off]))
          ? k + 1 : k - 1;
        const prevX  = prev[prevK + off];
        const afterX = prevK === k - 1 ? prevX + 1 : prevX;
        while (x > afterX) { edits.push({ type: 'equal',  val: a[x - 1] }); x--; y--; }
        if (prevK === k - 1) { edits.push({ type: 'delete', val: a[x - 1] }); x--; }
        else                 { edits.push({ type: 'insert', val: b[y - 1] }); y--; }
      }
      while (x > 0) { edits.push({ type: 'equal', val: a[x - 1] }); x--; y--; }

      return edits.reverse();
    }
  </script>
</body>
</html>
