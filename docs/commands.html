<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>ReTrack — commands</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <script>
    // This page has no visible UI. Word loads it in a hidden webview purely
    // to run minimizeChanges() when the ribbon button (see manifest.xml,
    // Action xsi:type="ExecuteFunction") is clicked.

    Office.onReady(function () {
      Office.actions.associate('minimizeChanges', minimizeChanges);
    });

    function minimizeChanges(event) {
      runMinimize()
        .catch(function (e) { showError(e.message || String(e)); })
        .then(function () { event.completed(); });
    }

    async function runMinimize() {
      await Word.run(async ctx => {
        ctx.document.changeTrackingMode = Word.ChangeTrackingMode.trackAll;

        const authorName = await detectAuthorName(ctx);

        const paragraphs = ctx.document.body.paragraphs;
        paragraphs.load('items');
        await ctx.sync();

        for (const paragraph of paragraphs.items) {
          await minimizeParagraph(ctx, paragraph, authorName);
        }
      });
    }

    // Office.js has no API to read the current Word user's display name for
    // Word (unlike Outlook's Office.context.mailbox.userProfile) short of
    // full SSO/Azure AD, which is out of scope for a zero-infrastructure
    // add-in. Instead, make one throwaway tracked edit — Word stamps it with
    // your real user name the same way it stamps any edit — read that name
    // back, then reject the edit away so the document is left exactly as it
    // was found.
    async function detectAuthorName(ctx) {
      const probe = ctx.document.body.getRange(Word.RangeLocation.start);
      const inserted = probe.insertText('\u200B', Word.InsertLocation.replace);
      await ctx.sync();

      const probeChanges = inserted.getTrackedChanges();
      probeChanges.load('items');
      await ctx.sync();

      if (probeChanges.items.length === 0) {
        throw new Error('Could not determine your reviewer name — make sure Track Changes is available in this document.');
      }

      const probeChange = probeChanges.items[0];
      probeChange.load('author');
      await ctx.sync();
      const authorName = probeChange.author;

      probeChange.reject();
      await ctx.sync();

      return authorName;
    }

    function showError(message) {
      const url = location.href.replace(/commands\.html.*$/, 'dialog.html') + '?msg=' + encodeURIComponent(message);
      Office.context.ui.displayDialogAsync(url, { height: 30, width: 40, displayInIframe: false });
    }

    // ── Per-paragraph scan ───────────────────────────────────────────────────
    // Walks left to right through the paragraph exactly once. cursor only ever
    // moves forward past a group it has already rewritten, so a freshly
    // minimized delete+insert pair (which is itself an adjacent Deleted+Added
    // pair, indistinguishable from an unminimized one to getTrackedChanges())
    // is never rediscovered and re-diffed — that would otherwise loop forever
    // on words with no shorter minimization (e.g. delete "brown"/insert "red").
    async function minimizeParagraph(ctx, paragraph, authorName) {
      let cursor = paragraph.getRange(Word.RangeLocation.start);
      const paraEnd = paragraph.getRange(Word.RangeLocation.end);

      while (true) {
        const scope = cursor.expandTo(paraEnd);
        const trackedChanges = scope.getTrackedChanges();
        trackedChanges.load('items');
        await ctx.sync();
        if (trackedChanges.items.length === 0) break;

        trackedChanges.items.forEach(tc => tc.load(['type', 'author', 'text']));
        await ctx.sync();

        const revisions = trackedChanges.items.map(tc => ({ type: tc.type, author: tc.author, text: tc.text, ref: tc }));
        const group = findAdjacentGroup(revisions, authorName);
        if (!group) break;

        const allRevs = group.deletedRun.concat(group.addedRun).sort((a, b) => a.order - b.order);
        const groupRange = allRevs[0].ref.getRange(Word.RangeLocation.start)
          .expandTo(allRevs[allRevs.length - 1].ref.getRange(Word.RangeLocation.end));

        const deletedText = group.deletedRun.map(r => r.text).join('');
        const insertedText = group.addedRun.map(r => r.text).join('');

        allRevs.forEach(r => r.ref.reject());
        await ctx.sync();

        cursor = await applyDiffInRange(ctx, groupRange, deletedText, insertedText);
      }
    }

    // Finds the first adjacent Deleted-run + Added-run (in either order) where
    // every revision in both runs is authored by authorName. A lone
    // Deleted-only or Added-only run (nothing to minimize) or a run authored
    // by someone else is skipped over, not treated as a match.
    function findAdjacentGroup(revisions, authorName) {
      revisions.forEach((r, idx) => { r.order = idx; });

      let i = 0;
      while (i < revisions.length) {
        const r = revisions[i];
        if ((r.type !== 'Deleted' && r.type !== 'Added') || r.author !== authorName) { i++; continue; }

        const runType = r.type;
        let j = i;
        const run = [];
        while (j < revisions.length && revisions[j].type === runType && revisions[j].author === authorName) {
          run.push(revisions[j]); j++;
        }

        const otherType = runType === 'Deleted' ? 'Added' : 'Deleted';
        if (j < revisions.length && revisions[j].type === otherType && revisions[j].author === authorName) {
          let k = j;
          const otherRun = [];
          while (k < revisions.length && revisions[k].type === otherType && revisions[k].author === authorName) {
            otherRun.push(revisions[k]); k++;
          }
          return runType === 'Deleted'
            ? { deletedRun: run, addedRun: otherRun }
            : { deletedRun: otherRun, addedRun: run };
        }

        i = j;
      }
      return null;
    }

    // ── Apply a word-level diff inside baseRange, replacing beforeText with
    // afterText. Returns a Range anchored at the end of baseRange, which
    // stays valid past the rewritten content since only insertions/deletions
    // before it occur. Each edit group is located by searching a shrinking
    // [cursor, end) scope so the leftmost match is always the correct next
    // occurrence even when the same token text repeats later in the range.
    async function applyDiffInRange(ctx, baseRange, beforeText, afterText) {
      const edits = myersDiff(tokenize(beforeText), tokenize(afterText));

      const endAnchor = baseRange.getRange(Word.RangeLocation.end);
      let cursor = baseRange.getRange(Word.RangeLocation.start);

      let i = 0;
      while (i < edits.length) {
        const type = edits[i].type;
        let text = '';
        while (i < edits.length && edits[i].type === type) { text += edits[i].val; i++; }

        if (type === 'equal' && i >= edits.length) {
          // Trailing unchanged text — nothing follows it, so there's no
          // need to locate it (its range.text sometimes includes an
          // invisible paragraph-end character that search() won't match).
        } else if (type === 'insert') {
          const inserted = cursor.insertText(text, Word.InsertLocation.replace);
          await ctx.sync();
          cursor = inserted.getRange(Word.RangeLocation.end);
        } else {
          const scope = cursor.expandTo(endAnchor);
          const results = scope.search(text, { matchCase: true, matchWholeWord: false });
          results.load('items');
          await ctx.sync();
          if (results.items.length === 0) throw new Error(`Could not locate "${text}" while minimizing changes.`);
          const match = results.items[0];

          if (type === 'equal') {
            cursor = match.getRange(Word.RangeLocation.end);
            await ctx.sync();
          } else {
            const afterDelete = match.getRange(Word.RangeLocation.start);
            match.delete();
            await ctx.sync();
            cursor = afterDelete;
          }
        }
      }

      return endAnchor;
    }

    // ── Tokenizer ─────────────────────────────────────────────────────────────
    // Each non-space run absorbs its trailing whitespace, so no token is ever
    // pure whitespace — Word's range.search() doesn't reliably match a
    // whitespace-only query, which made apply() fail on lone-space edit groups.
    function tokenize(text) {
      return text.match(/\S+\s*|\s+/g) || [];
    }

    // ── Myers diff ────────────────────────────────────────────────────────────
    // Returns [{type: 'equal'|'delete'|'insert', val: token}, ...]
    function myersDiff(a, b) {
      const n = a.length, m = b.length;
      if (n === 0 && m === 0) return [];
      if (n === 0) return b.map(val => ({ type: 'insert', val }));
      if (m === 0) return a.map(val => ({ type: 'delete', val }));

      const max = n + m, off = max;
      const v = new Array(2 * max + 1).fill(0);
      const trace = [];

      outer:
      for (let d = 0; d <= max; d++) {
        trace.push(v.slice());
        for (let k = -d; k <= d; k += 2) {
          let x = (k === -d || (k !== d && v[k - 1 + off] < v[k + 1 + off]))
            ? v[k + 1 + off]
            : v[k - 1 + off] + 1;
          let y = x - k;
          while (x < n && y < m && a[x] === b[y]) { x++; y++; }
          v[k + off] = x;
          if (x >= n && y >= m) break outer;
        }
      }

      const edits = [];
      let x = n, y = m;

      for (let d = trace.length - 1; d > 0; d--) {
        const prev = trace[d];
        const k = x - y;
        const prevK = (k === -d || (k !== d && prev[k - 1 + off] < prev[k + 1 + off]))
          ? k + 1 : k - 1;
        const prevX  = prev[prevK + off];
        const afterX = prevK === k - 1 ? prevX + 1 : prevX;
        while (x > afterX) { edits.push({ type: 'equal',  val: a[x - 1] }); x--; y--; }
        if (prevK === k - 1) { edits.push({ type: 'delete', val: a[x - 1] }); x--; }
        else                 { edits.push({ type: 'insert', val: b[y - 1] }); y--; }
      }
      while (x > 0) { edits.push({ type: 'equal', val: a[x - 1] }); x--; y--; }

      return edits.reverse();
    }
  </script>
</body>
</html>
